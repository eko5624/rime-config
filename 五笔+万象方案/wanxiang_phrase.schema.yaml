# Rime schema settings
# encoding: utf-8
schema:
  schema_id: wanxiang_phrase
  name: "万象·短语"
  version: "LTS"
  author: amzxyz
  description: |
    为应对9键、14键、18键等场景下使用用户词，且共用用户词，用户词库变更为bin引用，而不是userdb-table
engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"

translator:
  dictionary: custom_phrase
  prism: wanxiang_phrase
  enable_user_dict: false
