## 可自行添加自己所需的词库
## 注意词条与编码之间用tab缩进
## 示例： xxxx	aaaa	30

## 通过转义支持多行输出：\n \r \t \s \z、[[字面区块]]、字符\重复次数

## 数量重复 ( 字符 + \ + 数字 )
## a\3 => aaa     哈\2 => 哈哈     !\5 => !!!!!

## 基础转义
## \n : 换行符    \s : 空格    \t : 制表符
## [[...]] : 区块内不转义 (如: [[\Y]] 输出 \Y)

## 示例: 吧	b	5
## 示例: 哈\5	hhhhh	5
## 示例: 静夜思\n\s\3李白\n床前明月光\n疑似地上霜\n举头望明月\n低头思故乡	jys	5
