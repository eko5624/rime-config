schema:
  schema_id: wanxiang_t9
  name: 万象·九键
  version: "LTS"
  author:
    - amzxyz
  description: |
    万象拼音九宫格公共方案
  dependencies:
    - wanxiang_abbrev_t9  #公共简码库
    - wanxiang_phrase_t9  #自定义词库

switches:
  - name: emoji
    states: [ 💀, 😄 ]
    reset: 1
  - name: ascii_mode
    states: [ 中, 英 ]
    reset: 0
  - options: [ s2s, s2t, s2hk, s2tw ]  # 简繁转换开关组，可以在一个空选项和多个实际“- simplifier@s2hk”引入的项目之前切换，这是一个开关组，你可以将其中任意一个s2s等设置为toggle快捷键，多次按下将轮询
    states: [ 简体, 通繁, 港繁, 臺繁 ]
    reset: 0
  - name: full_pinyin  # T9/T9i：原编码 / 转全拼
    states: [原编码, 转全拼]
    reset: 1
  - name: toneless_hint  # T9/T9i：注释关 / 注释开
    states: [注释关, 注释开]
    reset: 0  #固定为无声调输出，其他前端用户可以适当patch修改
  - name: abbrev
    states: [简码关, 简码开]
    reset: 1
  - name: charset_filter # 0为CJK基本字符集+扩展A区，1为CJK全字符集
    states: [ 扩, 常 ]
    reset: 1
  - name: super_tips  # 超级提示，表情、翻译、车牌、符号等对应关系数据，并可实现句号上屏，不开启则默认，影响的是segment.prompt参数，归属：super_tips.lua
    states: [提示关, 提示开]
    reset: 1
  - name: context_reorder
    states: [上下文关, 上下文开]  # 上下文调频
    reset: 1
  - name: full_shape
    states: [ 半, 全 ]
    reset: 0
  - name: ascii_punct  # 中英标点
    states: [ "。，", "．，" ]
    reset: 0
    
engine:
  processors:
    - lua_processor@*wanxiang.context_reorder*P  # 靠自己养的专属上下文调频工具
    - lua_processor@*wanxiang.super_processor    # KP小键盘、字母选词、符号快打、超强分词、重复限制、退格限制、声调回退、以词定字
    - lua_processor@*wanxiang.super_tips         # 超级提示模块：表情、简码、翻译、化学式、等等靠你想象
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - history_translator@history
    - lua_translator@time_date
    - lua_translator@*calculator
    - lua_translator@*number                    # 数字金额大写
    - lua_translator@*force_gc                  # 暴力 GC 降低内存
    - lua_translator@*unicode                   # Unicode
  filters:
    - lua_filter@*wanxiang.custom_phrase        # 用户自定义置顶词与简码前置
    - lua_filter@*wanxiang.context_reorder*F    # 用于输入编码后的上下文调频
    - lua_filter@*wanxiang.super_comment_preedit  # 放其他需要注释处理器后面,会有清空注释的操作,超级注释模块，支持错词提示、辅助码显示，部件组字读音注释，支持个性化配置和关闭相应的功能，详情搜索super_comment进行详细配置
    - simplifier@s2t                            # 简转繁
    - simplifier@s2hk                           # 简转港
    - simplifier@s2tw                           # 简转台
    - simplifier@emoji                          # Emoji OpenCC
    - lua_filter@*wanxiang.super_filter         # 先进行字符过滤后简繁转换，这样能繁体继承简体权重。本质功能相关功能见Lua文件
    - uniquifier                                # 去重

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

# 主翻译器，拼音
translator:
  dictionary: wanxiang_lite  # 挂载主词库
  #  packs: user                  #导入根目录下名称为user.dict.yaml的自定义固定词典
  prism: wanxiang_t9  # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  enable_completion: true  # 启用候选词补全
  #  user_dict: zrm.userdb       # 用户词典的文件名称
  #  db_class: tabledb           #开启后就不会产生wanxiang.userdb这样的文件夹，会直接输出文本wanxiang.txt同时无法使用同步能力，可设 tabledb〔文本〕或 userdb〔二进制〕
  enable_user_dict: true  # 是否开启自动调频，即开启用户词典
  enable_sentence: false  #是否开启自动造句
  enable_correction: false  #是否开启自动纠错
  encode_commit_history: true  # 预留历史上屏自动编码成词
  contextual_suggestions: false  #模型预测，假设模型里面有的四个字的词汇 现在智能 而首选组合 现在只能 当你输入 现在 上屏后下一次输入zhi neng就会输出，智能前提是没有权重更高的了，很明显这与你的预期“现在只能”不符。很明显实际上又要预测又要连续句子，放一起是很难优雅的。
  max_homophones: 8
  core_word_length: 4  # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7  # >0 启用，过长短语不记整词，只加元素权重
  initial_quality: 3  #初始质量拼音的权重应该比英文大
  spelling_hints: 50  #将注释以词典code字符串形式完全暴露，通过super_comment.lua完全接管，灵活配置。
  always_show_comments: true  # Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供super_comment.lua做判断用。
  comment_format:
    - xform/;[a-z]{2}(,[a-z]{2})*//
  #disable_user_dict_for_patterns:  #如果你开启调频，需要一并考虑这个配置是否需要，基本的6码3字不调频，你可以自定义，目前的逻辑是依然记录用户词但满足规则的不输出不被使用
  #  - "^[a-z]{1,6}"                       # 限制在对应 tag 只在五笔输入时启用简繁转换

# 自定义短语，用来置顶
custom_phrase:
  dictionary: custom_phrase
  prism: wanxiang_phrase_t9
  db_class: stabledb
  enable_user_dict: false
  enable_completion: false
  always_show_comments: true
  spelling_hints: 50

# 自定义简码，用来游走在候选任意位置
abbrev_phrase:
  dictionary: wanxiang_abbrev_t9
  prism: wanxiang_abbrev_t9
  enable_user_dict: false
  enable_completion: false
  always_show_comments: true
  spelling_hints: 50
  insert_position: 3  #前置简码到候选3
  max_candidates: 3  #前置3个简码

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false                # 在 corrector.lua 及反查中，emoji 返回空注释

s2t:
  option_name: s2t
  opencc_config: wanxiang_s2t.json
  tips: none
  tags: [abc]

s2hk:
  option_name: s2hk
  opencc_config: wanxiang_s2hk.json
  tips: none
  tags: [abc]

s2tw:
  option_name: s2tw
  opencc_config: wanxiang_s2tw.json
  tips: none
  tags: [abc]

history:
  input: z
  size: 1
  initial_quality: 1

# 拼写设定
speller:
  # table_translator翻译器，支持自动上屏。例如 “zmhu”可以自动上屏“怎么回事”
  #  auto_select: true
  #  auto_select_pattern: ^[a-z]+/|^[a-df-zA-DF-Z]\w{3}|^e\w{4}
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射，alphabet就是将字符纳入输入编码的范畴
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210`/\
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210/
  delimiter: " '"  # 系统配置，第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  # 拼写匹配
  algebra:
    - xform/ⅱ//  #用于Lua判断输入类型的标记
    - xform/^(.*);.*$/$1/
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ/aaaaooooeeeeiiiiuuuuvvvvvnnn/
    - xform/ḿ/me/
    - xform/m̀/me/
    - derive/^ng$/eng/
    - xform/^n$/en/
    #- abbrev/^([a-z]).*/$1/
    - derive/^(.*)$/\U$1/
    #- abbrev/^([A-Z]).*/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([NL])VE$/$1UE/
    - derive/ong$/on/
    - derive/iong$/ion/
    - derive/ONG$/ON/
    - derive/IONG$/ION/
    - derive/^([jqxy])u/$1v/
    - derive/^([JQXY])U/$1V/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/22233344455566677778889999/

# 标点符号
# punctuator 下面有三个子项：
#   full_shape 全角标点映射
#   half_shape 半角标点映射
#   symbols    Rime 的预设配置是以 '/' 前缀开头输出一系列字符，自定义的 symbols_v.yaml 修改成了 'v' 开头。
punctuator:
  digit_separators: ":,."  #数字分隔符
  __include: wanxiang_symbols:/symbol_table  # 从 symbols.yaml 导入配置
  __patch:
    - wanxiang_symbols:/symbols
    - t9_sym
t9_sym:
  half_shape/+:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": [1, "@", ！, ：, 、, ……, ～]
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]

key_binder:
  import_preset: default
  bindings:
    # 上下翻页 - =
    # - { when: has_menu, accept: minus, send: Page_Up }             # 与地球拼音的音调1声 - 冲突，故注释掉
    # - { when: has_menu, accept: equal, send: Page_Down }           # 与地球拼音的音调1声 - 冲突，故注释掉
    
    # 上下翻页 tab
    - { when: has_menu, accept: Tab, send: Page_Down }
    - {send: Escape, accept: space, when: composing}
    - {send: space, accept: space, when: has_menu}
    - { when: always, select: .next, accept: Control+1 }             # 在最近的两个方案之间切换
    - { when: always, toggle: transcription, accept: Control+2}      # 切换简繁
    - { when: always, toggle: extend_charset, accept: Control+3 }    # 切换CJK字符集
    - { when: always, toggle: full_shape, accept: Control+4 }        # 切换全半角
    - { when: always, toggle: ascii_punct, accept: Control+5 }       # 切换中英标点

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    unicode: "^U[a-f0-9]+"              # 脚本将自动获取第 2 个字符 U 作为触发前缀，响应 lua_translator@*unicode，输出 Unicode 字符
    number: "^R[0-9]+[.]?[0-9]*"        # 脚本将自动获取第 2 个字符 R 作为触发前缀，响应 lua_translator@*number，数字金额大写
    calculator: "^=.*$"                 # 计算器功能引导

super_comment:  # 超级注释模块，子项配置 true 开启，false 关闭
  candidate_length: 15  # 候选词辅助码提醒的生效长度，0为关闭  但同时清空其它，应当使用上面开关来处理
  corrector_type: "comment"  # 注意9键里应原状态输出，不要加括号。随意更换左右括号，比如"〔comment〕" 不加括号为无括号，comment占位不能动
  tone_isolate: true  # 是否将数字声调从转换后拼音中隔离出来（true=隔离， false 直接参与转换）例如：nǐ3
  convert_abbrev_preedit: false  #单音节简码是否转换为全拼读音
  cand_type:

super_processor:
  enable_backspace_limit: false  # 开启/关闭退格限制，九键莫动
  enable_seg_loop: false  # 开启/关闭分词符（'）循环，九键莫动
  enable_tone_fallback: false  # 启用声调回退，九键莫动
  enable_predict_space: true  # 启用联想空格打断，直接上屏空格并清空联想，对齐大厂
  kp_number_mode: auto  # 小键盘模式 (auto / compose / select)，九键莫动
  limit_repeated: "8,40"  #格式："最大重复声母数,最大候选字数"
  select_character: "[,]"  # 开启以词定字，自动拆解第一位上屏首字，第二位上屏尾字
  # 下面这些写法都支持：
  # select_character: "[,]"                      # [ 上屏首字，] 上屏尾字（推荐）
  # select_character: "bracketleft, bracketright"  # [ 上屏首字，] 上屏尾字（英文全拼）

context_reorder:
  db_name: context_reorder
  enable_fallback_reorder: false
  context_timeout: 5000
  custom_classifiers:
    - 个只名位口人头匹条群批伙多
    - 张把件台部块根颗粒滴片朵面扇顶栋座所辆艘架盏支枝杆
    - 双对副套打串束排阵堆叠摞扎
    - 杯瓶盒包份碗锅盆桶袋罐盘
    - 次场局回趟顿番遍声项宗桩款步招
    - 年月天周岁秒分刻代期届任夜季
    - 本册篇首句段卷幅节堂门帖字行
    - 米寸尺里斤两吨克升元角毛笔百千万亿

super_tips:
  tips_key: "comma"  # key英文单词不清楚去default找
  files:  # 自定义数据文件列表（可选，不配置则使用默认文件）
    - lua/data/tips_show.txt  # 仍可保留默认文件
    #- lua/data/my_tips.txt     # 用户自定义文件
  disabled_types:
    - "禁用类型A"
    - "禁用类型B"
    # 禁用的 tips 类型，初始化 tips 数据库的时候会直接忽略相关规则，修改部署后生效
    # 可选项为：偏旁，符号，化学式，时间，符号，组字，翻译，表情，货币，车牌, 单位

# 字符集过滤lua
# a,通用规范汉字表
# b,GB2312,
# g,GBK,
# T,Big5,(台港澳常用)
# j,简体,OpenCC (t2s)
# f,通用繁体,OpenCC (s2t)
# h,香港繁体, OpenCC (s2hk)
# t,台湾繁体, OpenCC (s2tw)
# u,基本区,U+4E00 - U+9FFF
# A-I,扩展 A-I 区,U+3400 及各扩展区 (支持到 Ext-I)
# c,兼容区汉字
# 你可以通过黑白名单微调你自己每个开关下面的字符集过滤清单，主数据库位于lua/charset.reverse.bin不可编辑
# 你可以按上面提到的规则代号在base处填写上基础集，还可以在每一个开关的开白名单设置微调数据，就像默认添加的字符集过滤在8105基础上新增了一些
# 你可以定义多个开关，多个开启状态的开关求并集，比如charset_filter开着，s2hk也开着，那么就会显示这两个集合的所有汉字
# 优雅的地方在于s2hk开着，charset_filter关着 我们照样能使用 港繁能用到的所有字，是真正的本体，无关字会被过滤，而当都开着则是享受简体转换成繁体的后的结果
# 这个设计真正的兼容了简繁转换与字符集过滤的矛盾，还能满足用户多种自定义需求，你可以在开关增加类别，并在charset下面新增option类去选择按照字区去过滤，等多种组合方式
charset_filter:
  - option: charset_filter
    base: a
    addlist:
      - "诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲"
    blacklist: []
  - option: s2t
    base: fa
    addlist: []
    blacklist: []
  - option: s2hk
    base: ha
    addlist: []
    blacklist: []
  - option: s2tw
    base: ta
    addlist: []
    blacklist: []