# Rime settings
# encoding: utf-8
# by: 空山明月
# date: 2024-05-27

schema:
  schema_id: wubi86
  name: "86五笔"
  version: "2.1"
  icon: icons/wubi.ico
  ascii_icon: icons/en.ico
  full_icon: icons/full.ico
  half_icon: icons/half.ico
  author:
    - 发明人 王永民
  description: |
    敲 z 键进入拼音反查

switches:
  - name: emoji
    states: [ 💀, 😄 ]
    reset: 1  
  - name: ascii_mode
    states: [ 中, 英 ]
    reset: 0
  - options: [s2s, s2t, s2hk, s2tw]  # 简繁转换开关组，可以在一个空选项和多个实际“- simplifier@s2hk”引入的项目之前切换，这是一个开关组，你可以将其中任意一个s2s等设置为toggle快捷键，多次按下将轮询
    states: [简体, 通繁, 港繁, 臺繁]
    reset: 0
  - name: extend_charset # 0滤除CJK扩展B-I区，1为CJK全字符集
    states: [ 常, 扩 ]
    reset: 0
  - name: chinese_english
    states: [ 翻译关, 翻译开 ]
    reset: 0
  - name: chaifen
    states: [ 隐, 显 ]
    reset: 1
  - name: pinyin_hint
    states: [ 形, 音 ]
    reset: 1
  - name: single_char
    states: [ 词, 单 ]
    reset: 0
  - name: full_shape
    states: [ 半, 全 ]
    reset: 0
  - name: ascii_punct
    states: [ "。，", "．，" ]
    reset: 0
  - name: charset_comment
    states: [ 码区关, 码区开 ]
    reset: 0

engine:
  processors:
    - ascii_composer
    - lua_processor@alphabet_mode_processor
    - recognizer
    - key_binder
    - speller
    - lua_processor@alphabet_mode_post_speller_processor
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@pinyin_lookup
    - affix_segmentor@wubi86_lookup
    - affix_segmentor@radical_lookup
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - history_translator@history
    - lua_translator@time_date                  # 农历、日期、节气、节日、时间、周
    - lua_translator@*calculator                # 计算器
    - lua_translator@*number                    # 数字金额大写
    - lua_translator@*force_gc                  # 暴力 GC 降低内存
    - lua_translator@*unicode                   # Unicode
    - lua_translator@alphabet_mode_translator
    - table_translator@custom_phrase            # 自定义短语 custom_phrase.txt
    - script_translator@pinyin_lookup
    - script_translator@wubi86_lookup
    - script_translator@radical_lookup
    - script_translator
  filters:
    - simplifier@s2t                            # 简转繁
    - simplifier@s2hk                           # 简转港
    - simplifier@s2tw                           # 简转台
    - simplifier@emoji                          # 候选表情
    - lua_filter@*charset*filter                # CJK字符集过滤
    - lua_filter@*charset*comment_hint          # CJK字符集码区提示
    - lua_filter@single_char                    # 单字输入模式
    - lua_filter@*multi_line                    # 支持词条多行输出
    - reverse_lookup_filter@pinyin_reverse_lookup
    - reverse_lookup_filter@radical_reverse_lookup
    - simplifier@chaifen                        # 五笔字根拆分滤镜
    - simplifier@pinyin_hint                    # 以形查音滤镜
    - simplifier@chinese_english                # 英汉互译
    - uniquifier                                # 去重

speller:
  #max_code_length: 10                  # 设置输入码的最大长度
  #auto_select: true                    # 四码唯一时，自动上屏
  #auto_clear: max_length               # 空码时自动清空

translator:
  dictionary: wubi86
  db_class: tabledb
  initial_quality: 1.5
  enable_charset_filter: false
  enable_sentence: false                # 开启句子输入模式
  enable_user_dict: false               # 开启用户词典
  enable_encoder: false                 # 开启自动造词
  encode_commit_history: false          # 是否对已上屏词自动成词（仅 table_translator 有效）
  max_phrase_length: 10                 # 设置候选词的最大长度
  enable_completion: false              # 是否显示编码未输入完整的词条
  preedit_format:                       # 上屏码自定义
#    - xform/.+//
  comment_format:                       # 提示码自定义
    - xform/.+//                        # 当前默认不提示编码，消除所有候选词后的提示码
  disable_user_dict_for_patterns:       # 不需要录入用户词典的编码
    - "^z.*$"

# 自定义短语
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase  # 需要手动创建 custom_phrase.txt 文件
  db_class: stabledb
  enable_completion: false # 补全提示
  enable_sentence: false   # 禁止造句
  initial_quality: 99      # custom_phrase 的权重应该比 pinyin 和 melt_eng 大

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false                # 在 corrector.lua 及反查中，emoji 返回空注释

s2t:
  option_name: s2t
  opencc_config: wanxiang_s2t.json
  tips: all
  tags: [abc]

s2hk:
  option_name: s2hk
  opencc_config: wanxiang_s2hk.json
  tips: all
  tags: [abc]

s2tw:
  option_name: s2tw
  opencc_config: wanxiang_s2tw.json
  tips: all
  tags: [abc]

history:
  input: z
  size: 1
  initial_quality: 1

chaifen:
  opencc_config: wb86_spelling.json
  option_name: chaifen
  show_in_comment: true 
  comment_format:     
    - "xform/&nbsp;/ /"
  tags: [pinyin_lookup]                 # 限制在对应 tag 只有在拼音反查五笔时才有拆分提示
  tips: all                             # 只给单字加滤镜，改为 char 。 词也显示，改为 all

pinyin_hint:
  opencc_config: pinyin.json
  option_name: pinyin_hint
  show_in_comment: true 
  comment_format:     
    - "xform/&nbsp;/ /"
  tags: [wubi86_lookup]                 # 限制在对应 tag
  tips: all                             # 只给单字加滤镜，改为 char 。 词也显示，改为 all

#汉译英
chinese_english:
  option_name: chinese_english
  opencc_config: chinese_english.json
  tags: [abc]
  tips: all
  comment_format:
    - "xform/-/ /"

pinyin_lookup:                          # 拼音反查五笔
  tag: pinyin_lookup
  dictionary: wanxiang_pro
  enable_user_dict: false               # 是否开启自动调频
  prefix: "z"
  tips: 〔拼音反查〕

pinyin_reverse_lookup:                  # 拼音反查五笔
  tags: [pinyin_lookup]
  dictionary: wubi86
  overwrite_comment: true

wubi86_lookup:                          # 五笔反查拼音
  tag: wubi86_lookup
  prefix: "`"
  suffix: ;
  dictionary: wubi86
  tips: 〔以形查音〕
  closing_tips: 〔五笔〕
  initial_quality: 1

radical_lookup:
  tag: radical_lookup
  enable_completion: false
  enable_sentence: false
  prefix: 'Uu'
  dictionary: radical_pinyin
  tips: 〔拆字查音〕
  closing_tips: 〔五笔〕
  comment_format:
    - xform/;[a-z]{2}(,[a-z]{2})*// # 删除注释里的五笔首二辅助码

radical_reverse_lookup:
  tags: [radical_lookup]
  overwrite_comment: true
  dictionary: wanxiang_pro

# 标点符号
# punctuator 下面有三个子项：
#   full_shape 全角标点映射
#   half_shape 半角标点映射
#   symbols    Rime 的预设配置是以 '/' 前缀开头输出一系列字符，自定义的 symbols_v.yaml 修改成了 'v' 开头。
punctuator:
  full_shape:
    __include: default:/punctuator/full_shape  # 从 default.yaml 导入配置
  half_shape:
    __include: default:/punctuator/half_shape  # 从 default.yaml 导入配置
  digit_separators:
    __include: default:/punctuator/digit_separators # 从 default.yaml 导入配置
  symbols:
    __include: wanxiang_symbols:/symbols            # 从 wanxiang_symbols 导入配置

key_binder:
  import_preset: default
  bindings:
    # 上下翻页 - =
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    
    # 上下翻页 tab
    - { when: has_menu, accept: Tab, send: Page_Down }
    - {send: Escape, accept: space, when: composing}
    - {send: space, accept: space, when: has_menu}
    - { when: always, select: .next, accept: Control+1 }             # 在最近的两个方案之间切换
    - { when: always, set_option: std, accept: Control+2 }           # 重置为通用体
    - { when: always, toggle: extend_charset, accept: Control+3 }    # 切换CJK字符集    
    - { when: always, toggle: single_char, accept: Control+4 }       # 切换词组/单字
    - { when: always, toggle: full_shape, accept: Control+5 }        # 切换全半角
    - { when: always, toggle: ascii_punct, accept: Control+6 }       # 切换中英标点
    - { when: always, toggle: chaifen, accept: Control+7}            # 切换字根拆分显隐
    - { when: always, set_option: s2hk, accept: Control+8 }          # 切换 通用 -> 香港繁体
    - { when: always, set_option: s2twp, accept: Control+9 }         # 切换 通用 -> 台湾片语

# 处理符合特定规则的输入码，如网址、反查
recognizer:
  import_preset: default  # 从 default.yaml 继承通用的
  patterns:  # 再增加方案专有的：
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    pinyin_lookup: "z[a-z]*'?$"        # 拼音反查五笔
    wubi86_lookup: "`[a-z]*'?$"         # 五笔反查拼音
    radical_lookup: "Uu[a-z]*'?$"       # 拆字反查拼音
    unicode: "^U[a-f0-9]+"              # 脚本将自动获取第 2 个字符 U 作为触发前缀，响应 lua_translator@*unicode，输出 Unicode 字符
    number: "^R[0-9]+[.]?[0-9]*"        # 脚本将自动获取第 2 个字符 R 作为触发前缀，响应 lua_translator@*number，数字金额大写
    calculator: "^=.*$"                 # 计算器功能引导
    alphabet_mode: '^[;].*$'

